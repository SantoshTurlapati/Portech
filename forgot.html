<!DOCTYPE html>
<html>

<head>

<title>Forgot Password - Portech</title>

<link rel="icon" type="image/png" href="logo.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
}

body{

background:



url('https://images.unsplash.com/photo-1522071820081-009f0129c71c')

center/cover no-repeat fixed;

color:white;

}


/* NAVBAR */

.navbar{

position:fixed;
top:0;
width:100%;

padding:15px 5%;

background: rgba(0,0,0,0.4);

}

.logo{

display:flex;
align-items:center;
gap:10px;

}

.logo img{

width:50px;
height:50px;

border-radius:50%;
border:2px solid white;

}


/* FORM */

.forgot-section{

padding-top:150px;

text-align:center;

}

.form-box{

width:400px;

margin:auto;

background:rgba(0,0,0,0.7);

padding:30px;

border-radius:15px;

border:1px solid rgba(255,255,255,0.1);

}

input{

width:100%;

padding:12px;

margin:10px 0;

border-radius:8px;

border:none;

}


.btn{

background:#00eaff;

color:black;

padding:12px;

border:none;

width:100%;

border-radius:25px;

cursor:pointer;

font-size:16px;

}


.btn:hover{

background:#ff6a00;

color:white;

}


.links{

margin-top:10px;

}


.links a{

color:#00eaff;

text-decoration:none;

}

</style>

</head>


<body>


<nav class="navbar">

<div class="logo">

<img src="logo.png">
<h2>Portech</h2>

</div>

</nav>



<section class="forgot-section">

<h1>Forgot Password</h1>

<p>Enter your email to reset password</p>

<div class="form-box">

<form>

<input type="email" placeholder="Enter Email">

<button class="btn">

Reset Password

</button>

</form>

<div class="links">

<a href="login.html">Back to Login</a>

</div>

</div>

</section>


</body>

</html>
