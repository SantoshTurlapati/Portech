<!DOCTYPE html>
<html>

<head>

<title>Portfolio - Portech</title>

<link rel="icon" type="image/png" href="logo.png">

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
scroll-behavior:smooth;
}

body{
background:#000;
color:white;
}


/* STARS BACKGROUND */

.stars{

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:url("https://www.transparenttextures.com/patterns/stardust.png");

animation:moveStars 60s linear infinite;

opacity:0.3;

z-index:-1;

}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:10000px 5000px;}
}


/* NAVBAR */

.navbar{

position:fixed;
top:0;
width:100%;

display:flex;
justify-content:space-between;
align-items:center;

padding:15px 5%;

background: rgba(0,0,0,0.4);

backdrop-filter: blur(10px);

border-bottom:1px solid rgba(255,255,255,0.2);

z-index:1000;

}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
width:50px;
height:50px;
border-radius:50%;
border:2px solid white;
}

.logo h2{
color:white;
}

.nav-links{
list-style:none;
display:flex;
gap:15px;
}

.nav-links a{
text-decoration:none;
color:white;
padding:10px 18px;
border-radius:20px;
background:rgba(255,255,255,0.1);
transition:.3s;
}

.nav-links a:hover{
background:#00eaff;
color:black;
}

.login-btn{
text-decoration:none;
color:black;
background:#00eaff;
padding:10px 25px;
border-radius:25px;
}

.login-btn:hover{
background:#ff6a00;
color:white;
}


/* HEADER */

.page-header{

height:50vh;

background:
url('https://images.unsplash.com/photo-1498050108023-c5249f4df085')

center/cover no-repeat;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

margin-top:70px;

}

.page-header h1{
font-size:50px;
color:#00eaff;
}


/* PORTFOLIO SECTION */

.portfolio-section{

padding:100px 10%;

text-align:center;

}

.portfolio-section h2{

font-size:38px;
margin-bottom:50px;
color:#00eaff;

}


/* GRID */

.portfolio-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:30px;

}


/* PROJECT CARD */

.project{

border-radius:15px;

overflow:hidden;

position:relative;

cursor:pointer;

border:2px solid rgba(255,255,255,0.1);

transition:.4s;

}


.project:hover{

box-shadow:0px 0px 25px #00eaff;

transform:translateY(-10px);

}


/* IMAGE */

.project img{

width:100%;
height:220px;

object-fit:cover;

transition:.6s;

}

.project:hover img{

transform:scale(1.2);

}


/* OVERLAY */

.overlay{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.7);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

opacity:0;

transition:.5s;

color:#00eaff;

}

.project:hover .overlay{

opacity:1;

}


.overlay h3{

margin-bottom:10px;

}


/* BUTTON */

.view-btn{

margin-top:10px;

padding:10px 20px;

background:#00eaff;

color:black;

border-radius:20px;

text-decoration:none;

font-size:14px;

}

.view-btn:hover{

background:#ff6a00;

color:white;

}


/* FOOTER */

.footer{

background:#111;

padding:30px;

text-align:center;

color:#aaa;

}

</style>

</head>
